name: Sync leads and store appointments to Supabase

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours - adjust to taste
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
